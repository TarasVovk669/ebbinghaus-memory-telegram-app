messages.greeting.start=Привет, %s! 👋\nЯ — твой личный помощник памяти!\n\n*Что я могу?*\nЯ помогаю запоминать важную информацию, используя методику Германа Эббингауза. Он обнаружил, что уже через 20 минут мы забываем 40%% новой информации, а через 9 часов — 60%%. Эта зависимость получила название кривой забывания Эббингауза. Поэтому, чтобы запомнить, например, новое слово на английском, я напомню о повторении через 30 минут, 8 часов, день, неделю и месяц.\n\n*Для чего можно использовать?*\nЯ полезен для:\n• изучения новых слов и терминов;\n• подготовки к экзаменам и тестам;\n• подготовки к интервью;\n• долговременного запоминания важной информации;
messages.greeting.help=*Готов начать?*\n\nОсновные правила:\n📌 *Категории*: используй #теги (не обязательно).\n✉️ *Сообщения*: отправляй в формате текста, документа, фото или видео. Поддерживаются пересланные сообщения.\n❌️ *Редактирование*: не удаляй оригинальные сообщения, иначе они будут потеряны.\n📝 *Тест*: Ты можешь создавать тесты на основе отправленных тобой сообщений. Просто нажми кнопку *"👁️ Просмотр"*, затем выбери *"📝 Тест"*, и я сгенерирую его для тебя.\n\nПример:\n```\n#обучение #память\nЭта концепция описывает, как способность сохранять информацию уменьшается со временем без попыток её удержать.\n```\n\nЧтобы продолжить, нажмите "➕️Добавить" - и я позабочусь обо всём остальном! 📝✨
