messages.help.info=Как пользоваться❓\n\n1️⃣ Нажми кнопку "*➕️Добавить*" в меню.\n2️⃣ Отправь или перешли мне сообщение с необходимой информацией, файлом, фото или видео; с помощью тега \[#\] можно указать нужную категорию, но это не обязательно.\n3️⃣ При необходимости - отредактируй сообщение с помощью вспомогательных команд.\n❌ Не удаляй сообщение через контекстное меню Telegram - только клавишей "Удалить", - иначе оно и дальше будет алгоритмизировано.\n📝 *Тест*: Ты можешь создавать тесты на основе отправленных тобой сообщений. Просто нажми кнопку *"👁️ Просмотр"*, затем выбери *"📝 Тест"*, и я сгенерирую его для тебя.\n\nПример:\n```\n#обучение #память\nЭта концепция описывает, как способность сохранять информацию уменьшается со временем без попыток её удержания.\n```\n\nЧтобы продолжить, нажми "➕️Добавить" - а я позабочусь обо всём остальном! 📝✨
