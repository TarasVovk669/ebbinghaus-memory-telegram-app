spring:
  application:
    name: ebbinghaus-memory-telegram-app
  security:
    user:
      name: ${ACTUATOR_USER:metrics}
      password: ${ACTUATOR_PASSWORD:secret}
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}?currentSchema=memorybot
    hikari:
      metrics-enabled: true
  ai:
    openai:
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL}
          response-format:
            type: json_object
    retry:
      max-attempts: 10
      backoff:
        initial-interval: 1s
        max-interval: 360s
        multiplier: 5

  flyway:
    schemas:
      - memorybot
    baseline-on-migrate: true
    locations: classpath:scripts
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  quartz:
    job-store-type: jdbc
    properties:
      org:
        quartz:
          jobStore:
            isClustered: false
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          threadPool:
            threadCount: 5
bot:
  token: ${BOT_TOKEN}
  name: ${BOT_NAME}
  owner: ${BOT_OWNER}
server:
  port: ${APP_PORT:8081}
app:
  max:
    try-fibonacci-time: 55
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ebbinghaus-memory-telegram-app
resilience4j:
  ratelimiter:
    instances:
      openai:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 10s
  retry:
    instances:
      telegram:
        maxAttempts: 5
        waitDuration: 300ms
