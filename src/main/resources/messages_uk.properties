messages.greeting.start=Привіт, %s! 👋\nЯ — твій особистий помічник пам'яті!\n\n*Що я можу?*\nЯ допомагаю запам'ятовувати важливу інформацію, використовуючи методику Германа Еббінгауза. Він виявив, що вже через 20 хвилин ми забуваємо 40%% нової інформації, а через 9 годин — 60%%. Ця залежність отримала назву кривої забування Еббінгауза. Тому, щоб запамʼятати, наприклад, нове слово англійською, я нагадаю про повторення через 30 хвилин, 8 годин, день, тиждень і місяць.\n\n*Для чого можна використати?*\nЯ корисний для:\n• вивчення нових слів і термінів;\n• підготовки до екзаменів і тестів;\n• підготовки до інтерв'ю;\n• тривалого запам'ятовування важливої інформації;
messages.greeting.help=*Готовий розпочати?*\n\nОсновні правила:\n📌 *Категорії*: використовуй #теги (не є обов'язковим).\n✉️ *Повідомлення*: надсилай у форматі тексту, документа, фото або відео. Підтримуються переслані повідомлення.\n❌️ *Редагування*: не видаляй оригінальні повідомлення, інакше вони будуть втрачені.\n📝 *Тест*: Ти можеш створювати тести на основі надісланих тобою повідомлень. Просто натисни кнопку *"👁️ Переглянути"*, а потім вибери *"📝 Тест"*, і я згенерую його для тебе.\n🔊 *Аудіо*: Ти можеш створювати аудіо на основі надісланих тобою повідомлень. Просто натисни кнопку *"👁️ Переглянути"*, а потім вибери *"🔊 Аудіо"*, і я згенерую його для тебе.\n\nПриклад:\n```\n#навчання #пам'ять\nЦя концепція описує, як здатність зберігати інформацію зменшується з часом без спроб її утримати.\n```\n\nЩоб продовжити, натисни "➕️Додати" - а я подбаю про все інше! 📝✨
