messages.help.info=Як користуватись❓\n\n1️⃣ Натисни кнопку "*➕️Додати*" в меню.\n2️⃣ Надішли або перешли мені повідомлення з необхідною інформацією, файлом, фото або відео; тегом \[#\] можна вказати потрібну категорію, але це не обов'язково.\n3️⃣ При потребі - відредагуй повідомлення за допомогою допоміжних команд.\n❌ Не видаляй повідомлення через контекстне меню телеграму - лише клавішею "Видалити", - інакше воно й надалі буде алгоритмізоване.\n📝 *Тест*: Ти можеш створювати тести на основі надісланих тобою повідомлень. Просто натисни кнопку *"👁️ Переглянути"*, а потім вибери *"📝 Тест"*, і я згенерую його для тебе.\n\nПриклад:\n```\n#навчання #пам'ять\nЦя концепція описує, як здатність зберігати інформацію зменшується з часом без спроб її утримати.\n```\n\nЩоб продовжити, натисни "*➕️Додати*" - а я подбаю про все інше! 📝✨\n
